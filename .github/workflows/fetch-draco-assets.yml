name: Fetch Draco Assets

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download Draco encoder assets
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/google/draco/main/javascript/npm/draco3dgltf/draco_encoder_gltf_nodejs.js \
            -o draco_encoder_gltf_nodejs.js
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/google/draco/main/javascript/npm/draco3dgltf/draco_encoder.wasm \
            -o draco_encoder.wasm

      - name: Upload Draco encoder artifact
        uses: actions/upload-artifact@v4
        with:
          name: draco-encoder-assets
          path: |
            draco_encoder_gltf_nodejs.js
            draco_encoder.wasm
          if-no-files-found: error
          compression-level: 0
